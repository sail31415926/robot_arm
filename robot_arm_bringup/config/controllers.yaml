controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # JOINT_VELOCITY 模式用：claim J1-3 velocity 接口（Gazebo 直接速度驱动）。
    # 与 real 同名同型，保证 mode_manager 切换逻辑「后端无感」；
    # launch 只 --inactive 加载，activate 由 mode_manager_node 管，与 arm_controller 互斥。
    arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    gimbal_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: true

arm_velocity_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3

# 实物模式专用：仅控制摄像头云台 Joint4/5/6
# arm_motor_node（CANopen）独立管理 Joint1-3，不经过此控制器
gimbal_controller:
  ros__parameters:
    joints:
      - Joint4
      - Joint5
      - Joint6
    # 仿真只 claim position：GazeboSystem 对同一关节同时拿到 position 和 velocity
    # 命令接口时，两种写入方式会互相打架（云台跟随明显打折）。JTC 只需要 position，
    # 轨迹点里的 velocities 仅用于插值，不需要 velocity 命令接口。
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: true
