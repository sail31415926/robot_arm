controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # JOINT_VELOCITY 模式用：claim J1-3 velocity 接口（Gazebo 直接速度驱动）。
    # 与 real 同名同型，保证 mode_manager 切换逻辑「后端无感」；
    # launch 只 --inactive 加载，activate 由 mode_manager_node 管，与 arm_controller 互斥。
    arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # JOINT_EFFORT 模式用（2026-08-11 开通）：claim J1-3 effort 接口。
    # 与 arm_controller / arm_velocity_controller 三者互斥（同关节一次只准一个命令接口）。
    # launch 只 --inactive 加载，activate 由 mode_manager_node 管。
    # ⚠️ 力矩模式没有位置闭环：一旦激活，关节只受指令力矩与重力支配 ——
    #    尚未做重力补偿，切进来时 J2/J3 会下垂（仿真里安全，实物先别开）。
    arm_effort_controller:
      type: effort_controllers/JointGroupEffortController

    gimbal_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: true

arm_velocity_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3

arm_effort_controller:
  ros__parameters:
    # 只 claim 臂 J1-3：云台 J4-6 没有 effort 接口（转发插件只有 position），
    # 力矩模式期间由 mode_manager 的 hold_controllers 用 gimbal_controller 顶住。
    joints:
      - Joint1
      - Joint2
      - Joint3

# 实物模式专用：仅控制摄像头云台 Joint4/5/6
# arm_motor_node（CANopen）独立管理 Joint1-3，不经过此控制器
gimbal_controller:
  ros__parameters:
    joints:
      - Joint4
      - Joint5
      - Joint6
    # 仿真只 claim position：GazeboSystem 对同一关节同时拿到 position 和 velocity
    # 命令接口时，两种写入方式会互相打架（云台跟随明显打折）。JTC 只需要 position，
    # 轨迹点里的 velocities 仅用于插值，不需要 velocity 命令接口。
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: true
