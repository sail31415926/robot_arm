# arm_node 参数配置
# 机械臂三关节整体节点，对外接口：JointTrajectory / joint_states
# 运动模式：插补位置模式（IP），waypoints 间线性插补，PDO + SYNC 同步
#
# 启动：
#   ros2 launch arm real.launch.py
#
# 单独调试：
#   ros2 run arm arm_node --ros-args --params-file install/arm/share/arm/config/hardware/arm.yaml

arm_node:
  ros__parameters:

    # ── CAN 总线 ───────────────────────────────────────────────────────────────
    can_interface:    "can0"
    sdo_timeout_ms:   500
    master_node_id:   127
    heartbeat_ms:     100         # joint1 驱动负责发心跳，其余关节无需关心

    # ── IP 模式与反馈 ───────────────────────────────────────────────────────────
    ip_period_ms:     10          # IP 插补周期（ms），与驱动器 0x60C2 保持一致
    feedback_fast_ms: 20          # 位置反馈周期（ms），50 Hz
    auto_enable:      true        # 启动时自动使能并切换 IP 模式

    # ── 各关节参数（等长数组，顺序对应 Joint1 / Joint2 / Joint3）─────────────
    joint_names:
      - "Joint1"
      - "Joint2"
      - "Joint3"

    node_ids:
      - 1
      - 2
      - 3

    counts_per_rev:
      - 524288    # RB200-CA D-JM 减速机端 19-bit，实测确认
      - 524288
      - 524288

    max_velocities:        # IP 模式 0x607F 最大速度 rad/s（电机物理上限）
                           # 与 moveit/config/joint_limits.yaml 的 max_velocity 保持一致
      - 3.14
      - 3.14
      - 3.14

    rated_torques:         # 额定力矩 Nm（用于 0x6077 力矩反馈换算）
      - 5.0
      - 30.0
      - 5.0
