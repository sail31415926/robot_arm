###############################################
# eMeetArm MoveIt Servo 配置
# 输入：~/delta_twist_cmds (geometry_msgs/TwistStamped, 单位 m/s, rad/s)
# 输出：/arm_controller/joint_trajectory
###############################################

use_gazebo: true
command_in_type: "speed_units"   # Twist 单位为 m/s 和 rad/s（非 [-1,1] 归一化）

scale:
  linear:     1.0
  rotational: 1.0
  joint:      1.0

low_pass_filter_coeff: 2.0       # 越大越信任滤波后的估计

publish_period:   0.02           # 50Hz：避免 JTC(100Hz) 每次都被抢占造成的卡顿
low_latency_mode: false

# 输出到 ros2_control 的 JointTrajectoryController
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions:     true
publish_joint_velocities:    false
publish_joint_accelerations: false

# 输出平滑滤波器
use_smoothing: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# 共享 move_group 的 planning scene，不自建
is_primary_planning_scene_monitor: false
monitored_planning_scene_topic: "/move_group/monitored_planning_scene"

# 关联到 MoveIt 规划组与帧
move_group_name:           arm
planning_frame:            arm_base_link
ee_frame_name:             tool0
robot_link_command_frame:  arm_base_link

# 命令超时：超过此秒数没收到 Twist 则停止伺服
# 0.5s 太长（机器人会漂 0.5s），改成 0.1s 让 servo 快速进入 HALT
incoming_command_timeout:        0.1
num_outgoing_halt_msgs_to_publish: 8

# 奇异点处理（DLS 阻尼自动调节）
lower_singularity_threshold:               17.0
hard_stop_singularity_threshold:           30.0
joint_limit_margin:                        0.01
leaving_singularity_threshold_multiplier:  2.0

# topic 名（节点默认名是 servo_node → 完整路径 /servo_node/...）
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic:     ~/delta_joint_cmds
joint_topic:                /joint_states
status_topic:               ~/status
command_out_topic:          /arm_controller/joint_trajectory

# 碰撞检测：关闭以提速，需要时改 true
check_collisions:                     false
collision_check_rate:                 5.0
self_collision_proximity_threshold:   0.01
scene_collision_proximity_threshold:  0.02
