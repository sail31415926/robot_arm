# arm_params_real.yaml — 实机（样机）覆盖层
#
# real.launch.py 先挂 arm_params.yaml 再挂本文件，**同名参数以本文件为准**。
# 所以这里只写「实机确实要偏离默认值」的项，不要整份拷贝 —— 拷贝了就等于把两份都变成
# 待同步的清单，公共项一改必漏一处。
#
# 当前状态：**本文件没有生效的覆盖项**。这是有意的 —— 实机现在跑的就是 arm_params.yaml
# 里那套值（= 参数化之前源码 constexpr 的原值），所以引入这套配置**没有改变任何实机行为**。
# 下面按「已有实测依据的候选调整」列成注释，标定时按需取消注释；每条都写清实测数字，
# 避免过一段时间忘了当初为什么调它。
#
# 改完确认是否真的生效（YAML 键写错是静默失效）：
#   ros2 param get /arm_commander velocity_stream.rate_hz
#   ros2 param get /arm_commander tolerance.joint_rad

arm_commander:
  ros__parameters:
    # 占位：ros__parameters 不能是空映射，否则 rcl 会报 No value at line 17 并让节点 abort。
    # 下面候选项全被注释时必须留一条无害的实项。实机无 /clock，本来就该是 false。
    use_sim_time: false

    # ── 候选①：速度流发布频率 ────────────────────────────────────────────────
    # 实测（J1 @0.15 rad/s 匀速点动，2026-08-12 样机）：
    #   50Hz（默认）：跟踪率 71%~74%，速度在 0~0.246 之间摆动（标准差 0.044），
    #                 领先量 0.097 rad —— 用户报的"抖动很大"就是这个。
    #                 机制：周期 20ms < 计划时长 lookahead 50ms，每条计划只执行 40%，
    #                 而计划开头正是样条最慢的一段。
    #   20Hz        ：跟踪率 100.4%，领先量降到 0.022 rad，但每段样条自身的加减速
    #                 形状暴露成更大纹波（标准差 0.117）。
    # 即：只调这个常数只能在「跟踪率」与「纹波」之间取舍，治本要换驱动器内部速度环
    # PV(3)（mode_manager 的 velocity_backend: velocity_controller）。
    # velocity_stream:
    #   rate_hz: 20.0

    # ── 候选②：到位容差放宽 ──────────────────────────────────────────────────
    # 仿真的位置接口是 SetPosition 运动学瞬移，实际位置恒等于设定点，误差天然为 0；
    # 实机有伺服静差与减速器回差，容差沿用仿真值可能让动作明明到位却走到 timeout。
    # 症状：动作 exit_reason=timeout 但 /joint_states 显示已停在目标附近。
    # 标定方法：跑几次 MoveToJoint，看 result.actual_joints 与目标的实际残差，取其 2~3 倍。
    # tolerance:
    #   joint_rad: 0.05
    #   position_m: 0.02
    #   orientation_deg: 3.0

    # ── 候选③：IK 超时放大 ───────────────────────────────────────────────────
    # Jetson 上 CPU 吃紧时 50ms 可能不够，表现为笛卡尔动作报 IK 失败/规划点被丢。
    # ik:
    #   timeout_s: 0.1

    # ── 候选④：收纳位 ────────────────────────────────────────────────────────
    # 样机"该收到哪"未必是机械零点（例如需要避开线束或让云台朝下）。确定后填这里，
    # 6 个数按 Joint1..Joint6，单位 rad。
    # posture:
    #   stowed_joints: [0.0, 1.2, -2.0, 0.0, 0.0, 0.0]

mode_manager_node:
  ros__parameters:

    # ── 候选⑤：速度总线限幅收紧 ──────────────────────────────────────────────
    # 样机调试期把单轴上限压小比改 URDF 安全（URDF 是多方共用的真相源）。
    # max_joint_velocity: 0.5

    # ── 力矩模式：实机故意**不配** effort_controller ─────────────────────────
    # 保持空字符串 = 切 JOINT_EFFORT 会被拒。原因：重力补偿尚未在实机标定，
    # 而力矩模式下发 0 不是"停"而是自由下垂（仿真实测 J2 直接砸到下限）。
    # 等重力模型在实机验过再放开，别在这里顺手填上。
    effort_controller: ""
