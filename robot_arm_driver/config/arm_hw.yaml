# arm_hw.yaml — ArmHardwareInterface 硬件配置
#
# 由 URDF <ros2_control><hardware><param name="config_file"> 指向本文件，
# ArmHardwareInterface::on_init 用 yaml-cpp 读取。改硬件参数只动本文件、不碰 xacro。
# 注：sim_mode 不在此（它是 backend/launch 的开关，由 URDF 的 arm_sim_mode 决定）。

arm_hardware:
  can_interface:     "can0"
  sdo_timeout_ms:    500
  master_node_id:    127
  heartbeat_ms:      100     # node0 驱动周期发主站心跳
  feedback_fast_ms:  20      # 后台反馈轮询周期（20ms = 50Hz）
  ip_period_ms:      10      # IP 插补周期，与 controller_manager update_rate=100 对齐
  enable_stagger_ms: 150     # 逐关节使能错峰，降低同时上电的瞬时涌流
  pp_accel:          1.0     # PV 模式加速度（rad/s²）
  pp_decel:          1.0     # PV 模式减速度（rad/s²）

  # 每关节参数，按 URDF 里的关节名索引
  joints:
    Joint1: { node_id: 1, counts_per_rev: 524288, max_velocity: 1.0 }
    Joint2: { node_id: 2, counts_per_rev: 524288, max_velocity: 1.0 }
    Joint3: { node_id: 3, counts_per_rev: 524288, max_velocity: 1.0 }
