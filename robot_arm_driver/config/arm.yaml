# arm_node 参数配置
# 机械臂三关节整体节点，对外接口：JointTrajectory / joint_states
# motion_mode 由 real.launch.py 根据 controller 参数覆盖（slider→pp，其余→ip）
#
# 启动：
#   ros2 launch robot_arm_bringup real.launch.py
#
# 单独调试：
#   ros2 run robot_arm_driver arm_node --ros-args --params-file install/robot_arm_driver/share/robot_arm_driver/config/arm.yaml

arm_node:
  ros__parameters:

    # ── CAN 总线 ───────────────────────────────────────────────────────────────
    can_interface:    "can0"
    sdo_timeout_ms:   500
    master_node_id:   127
    heartbeat_ms:     100         # joint1 驱动负责发心跳，其余关节无需关心

    # ── 运动模式与反馈 ─────────────────────────────────────────────────────────
    # motion_mode 由 launch 文件根据 controller 参数动态覆盖，此处为缺省值
    # motion_mode: "ip"           # "ip" = 插补位置模式；"pp" = 轮廓位置模式
    ip_period_ms:     10          # IP 模式插补周期（ms），与驱动器 0x60C2 保持一致
    pp_accel:         1.0         # PP 模式加速度（rad/s²），写入驱动器 0x6083
    pp_decel:         1.0         # PP 模式减速度（rad/s²），写入驱动器 0x6084
    feedback_fast_ms: 20          # 位置反馈周期（ms），50 Hz
    auto_enable:      true        # 启动时自动使能并切换对应模式

    # ── 各关节参数（等长数组，顺序对应 Joint1 / Joint2 / Joint3）─────────────
    joint_names:
      - "Joint1"
      - "Joint2"
      - "Joint3"

    node_ids:
      - 1
      - 2
      - 3

    counts_per_rev:
      - 524288    # RB200-CA D-JM 减速机端 19-bit，实测确认
      - 524288
      - 524288

    max_velocities:        # 最大速度 rad/s（IP 模式 0x607F / PP 模式轮廓速度上限）
                           # PP 模式：每次指令速度 = min(dist/time, max_velocity)
      - 1.0
      - 1.0
      - 1.0

    rated_torques:         # 额定力矩 Nm（用于 0x6077 力矩反馈换算）
      - 5.0
      - 30.0
      - 5.0
