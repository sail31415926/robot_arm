emeet_camera_node:
  ros__parameters:
    camera_type: "auto"
    video_device: "auto"
    width: 1920
    height: 1080
    fps: 30
    pixel_format: "MJPEG"
    publish_display_raw: true
    publish_display_compressed: false
    brightness: 128

    # PTZ and Tracking Mode Settings
    go_to_zero_on_startup: true
    force_standard_mode_on_startup: true
    tracking_mode_standard_byte: 0
    tracking_mode_set_delay_sec: 3.5  # 增加延迟，等视频流完全稳定后再发命令
    tracking_mode_set_retries: 5      # 多试几次，确保命令生效
