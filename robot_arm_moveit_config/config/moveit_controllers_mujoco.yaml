# MoveIt 控制器配置 —— MuJoCo 仿真模式
# 不依赖 ros2_control；mujoco_node 提供 FollowJointTrajectory action server。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_execution_duration_scaling: 3.0
  allowed_goal_duration_margin: 10.0
  allowed_start_tolerance: 0.5
  moveit_manage_controllers: false

# 注意：控制器条目必须嵌套在 moveit_simple_controller_manager 下
# （参数路径 moveit_simple_controller_manager.<name>.action_ns），写顶层无效。
moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
